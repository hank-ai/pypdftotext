[build-system]
requires = ["flit_core>=3.4,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "pypdftotext"
authors = [{ name = "Sam Hartzog", email = "sam.hartzog@hank.ai" }]
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = ["pypdf>=6.5,<7", "tqdm>=4.34", "azure-ai-documentintelligence>=1.0.0,<2"]

[project.optional-dependencies]
s3 = ["boto3>=1.36.6,<2"]
image = ["pillow>=8.0.0,<13"]
full = ["boto3>=1.36.6,<2", "pillow>=8.0.0,<13"]
dev = [
  "boto3>=1.36.6,<2",
  "pillow>=8.0.0,<13",
  "boto3-stubs[s3]",
  "pytest>=7.0.0,<9",
  "pytest-cov>=4.0.0,<8",
  "ruff>=0.15.2,<0.16",
  "pyright>=1.1.408",
]

[project.urls]
Home = "https://github.com/hank-ai/pypdftotext"
Issues = "https://github.com/hank-ai/pypdftotext/issues"

[tool.flit.sdist]
exclude = [
  "samples/",
  "tests/",
  ".vscode/",
  ".claude/",
  "CLAUDE.md",
  "pypdftotext.code-workspace",

  # Version control
  ".git/",
  ".gitignore",
  ".gitattributes",
  ".gitmodules",

  # CI / GitHub
  ".github/",
  ".travis.yml",
  ".circleci/",
  "azure-pipelines.yml",
  "Jenkinsfile",

  # Dev tooling
  ".editorconfig",
  ".pre-commit-config.yaml",
  ".flake8",
  ".pylintrc",
  "tox.ini",
  "noxfile.py",
  ".nox/",
  ".mypy_cache/",
  ".ruff_cache/",
  "ruff.toml",
  "pyrightconfig.json",

  # Test suite
  "tests/",
  "conftest.py",

  # Docs source (not the built output, if you include that)
  "docs/",

  # Build / dist artifacts
  "dist/",
  "build/",
  "*.egg-info/",
  ".eggs/",
  "__pycache__/",
  "*.py[cod]",

  # OS artifacts
  ".DS_Store",
  "Thumbs.db",
  "Desktop.ini",

  # Docker / Vagrant / local env
  "Dockerfile",
  "docker-compose*.yml",
  ".dockerignore",
  "Vagrantfile",
  ".env",
  ".envrc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
  "-v",
  "--strict-markers",
  "--tb=short",
  "--cov=pypdftotext",
  "--cov-report=term-missing",
  "--cov-report=html",
]
markers = [
  "unit: Unit tests",
  "integration: Integration tests",
  "slow: Slow tests",
]

[tool.coverage.run]
source = ["pypdftotext"]
omit = ["tests/*", "scripts/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]
precision = 2
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"
